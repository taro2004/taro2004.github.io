<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>とろ〜り焼きマシュマロ｜学祭出店</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap');

  :root{
    --pink: #ffd7e6;
    --pink-dark: #ff9ec7;
    --orange: #ffb454;
    --orange-dark: #ff8a3d;
    --cream: #fff8ee;
    --brown: #7a4a2b;
    --brown-light: #a97449;
    --text: #5a3b28;
    --white: #ffffff;
  }

  *{ box-sizing: border-box; margin:0; padding:0; }

  body{
    font-family: 'M PLUS Rounded 1c', sans-serif;
    background: var(--cream);
    color: var(--text);
    line-height: 1.7;
    max-width: 480px;
    margin: 0 auto;
    padding-bottom: 40px;
  }

  a{ text-decoration:none; color:inherit; }

  /* ===== Hero ===== */
  .hero{
    text-align:center;
    padding: 40px 20px 24px;
  }
  .hero-emoji{ font-size: 3.4rem; margin-bottom: 6px; display:flex; align-items:center; justify-content:center; gap: 6px; }
  .mallow-icon{ width: 52px; height: auto; }
  .mallow-icon.small{ width: 20px; vertical-align: -4px; }
  .hero h1{
    font-size: 1.5rem;
    color: var(--brown);
    line-height: 1.5;
    margin-bottom: 10px;
  }
  .hero h1 .accent{ color: var(--orange-dark); }
  .hero p.sub{
    font-size: 0.9rem;
    color: var(--brown-light);
  }

  /* ===== Order button (QR replacement) ===== */
  .order-box{
    margin: 0 20px 30px;
    background: var(--white);
    border-radius: 20px;
    padding: 20px;
    text-align: center;
    box-shadow: 0 6px 0 var(--pink);
  }
  .order-box .label{
    font-size: 0.8rem;
    font-weight: 800;
    color: var(--pink-dark);
    margin-bottom: 8px;
  }
  .order-btn{
    display:block;
    background: var(--orange);
    color: var(--white);
    font-weight: 800;
    font-size: 1.05rem;
    padding: 16px;
    border-radius: 999px;
    box-shadow: 0 5px 0 var(--orange-dark);
  }
  .order-btn.disabled{
    background: #e0d6cc;
    box-shadow: 0 5px 0 #cabfb2;
    color: var(--white);
  }
  .order-box .note{
    font-size: 0.75rem;
    color: var(--brown-light);
    margin-top: 10px;
  }

  /* ===== Section ===== */
  section{
    padding: 0 20px 30px;
  }
  .section-title{
    font-size: 1.05rem;
    font-weight: 800;
    color: var(--brown);
    margin-bottom: 14px;
    display:flex;
    align-items:center;
    gap:6px;
  }

  /* ===== Info list ===== */
  .info-list{
    background: var(--white);
    border-radius: 18px;
    box-shadow: 0 4px 0 var(--pink);
    padding: 4px 16px;
  }
  .info-row{
    display:flex;
    gap: 12px;
    padding: 13px 0;
    border-bottom: 1px solid var(--cream);
    font-size: 0.88rem;
  }
  .info-row:last-child{ border-bottom:none; }
  .info-row .icon{ font-size: 1.2rem; width: 24px; text-align:center; }
  .info-row .label{ color: var(--brown-light); width: 66px; flex-shrink:0; }
  .info-row .value{ font-weight: 700; color: var(--brown); }
  .info-row .value.placeholder{ color: var(--orange-dark); }

  footer{
    text-align:center;
    font-size: 0.75rem;
    color: var(--brown-light);
    padding: 10px 20px 0;
  }

  .dev-note{
    margin: 0 20px 26px;
    background: var(--pink);
    border-radius: 14px;
    padding: 12px 16px;
    font-size: 0.78rem;
    color: var(--brown);
    text-align:center;
  }
</style>
</head>
<body>

<svg style="display:none">
  <symbol id="mallow" viewBox="0 0 60 100">
    <line x1="30" y1="78" x2="30" y2="98" stroke="#8b5e3c" stroke-width="5" stroke-linecap="round"/>
    <clipPath id="mallow-clip"><rect x="1" y="1" width="58" height="78" rx="18"/></clipPath>
    <g clip-path="url(#mallow-clip)">
      <rect x="1" y="1" width="58" height="78" fill="#ffffff"/>
      <rect x="1" y="1" width="58" height="20" fill="#d99a56"/>
      <rect x="1" y="15" width="58" height="9" fill="#eac088"/>
    </g>
    <rect x="1" y="1" width="58" height="78" rx="18" fill="none" stroke="#f0ddc4" stroke-width="2"/>
  </symbol>
</svg>

<div class="hero">
  <h1>外はカリッと、中は<span class="accent">とろ〜り</span><br>焼きマシュマロ</h1>
  <p class="sub">虹色祭限定出店</p>
</div>

<div class="order-box">
  <div class="label">📱 ご注文はこちら</div>
  <a href="https://[2001:2c0:100:417:18:cafe:52:1]/order/3" class="order-btn disabled">注文サイト</a>
  <div class="note">開店時間になりましたら、こちらのボタンからアクセスできるようになります</div>
</div>

<section>
  <div class="section-title">📍 開催情報</div>
  <div class="info-list">
    <div class="info-row"><span class="icon">🎪</span><span class="label">学祭</span><span class="value">虹色祭（帝塚山大学）</span></div>
    <div class="info-row"><span class="icon">📅</span><span class="label">日程</span><span class="value">11/21（土）・11/22（日）</span></div>
    <div class="info-row"><span class="icon">⏰</span><span class="label">時間</span><span class="value">10:00〜16:30</span></div>
    <div class="info-row"><span class="icon">📌</span><span class="label">場所</span><span class="value placeholder">〇〇ブース</span></div>
  </div>
</section>

<footer>
  とろ〜り焼きマシュマロ｜学祭でお待ちしています
</footer>

</body>
</html>
